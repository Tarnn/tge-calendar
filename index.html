<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
    <title>TGE Calendar — token launches, sales, airdrops and unlocks</title>
    <meta
      name="description"
      content="A sourced calendar of token generation events, exchange listings, token sales, airdrops and unlocks, with live Polymarket odds for launches that have not been announced yet."
    />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:site_name" content="TGE Calendar" />
    <meta property="og:title" content="TGE Calendar" />
    <meta
      property="og:description"
      content="Every token launch, before it lists. Sourced dates plus live prediction-market odds."
    />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TGE Calendar — every token launch, before it lists" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem("tge:theme") || '"system"')
          var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.dataset.theme = dark ? "dark" : "light"
        } catch (e) {
          document.documentElement.dataset.theme = "dark"
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
