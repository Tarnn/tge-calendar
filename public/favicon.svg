    <ellipse cx="256" cy="412" rx="176" ry="50" fill="none" stroke="#f7931a" stroke-width="30"/>
    <path d="M196 412 L220 0 H292 L316 412 Z" fill="url(#halo)"/>
    <circle cx="268" cy="232" r="128" fill="url(#edge)"/>
