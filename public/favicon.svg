<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>TGE Calendar</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191a2b"/>
      <stop offset="0.6" stop-color="#0c0c14"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="58%">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#f7931a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc061" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffd089" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffc061" stop-opacity="0.45"/>
